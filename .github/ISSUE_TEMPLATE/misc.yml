name: Misc Task/Question
description: File a task/question for something related to a project but not actually inside the project source - e.g., for someone to answer a question you have about the project or to edit a build machine or GitHub Action.
labels: misc
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Write a concise yet detailed description of the task and your desired outcome. Do include any relevant screenshots at suitable locations in the body of your text.
    validations:
      required: true
      

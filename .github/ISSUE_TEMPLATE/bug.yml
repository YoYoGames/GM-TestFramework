name: Bug
description: File a report for a test which needs fixing because when those tests are performed incorrect results are being returned
type: "TestFramework Bug"
projects: ["YoYoGames/26"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Write a concise yet detailed description of the issue and do include any relevant screenshots at suitable locations in the body of your text.
    validations:
      required: true
      
  - type: input
    id: expected
    attributes:
      label: Expected Change
      description: If it is not obvious from your Description text, what difference would you expect to see once this is fixed?
    validations:
      required: false
      
  - type: input
    id: scriptname
    attributes:
      label: Script Name
      description: Which script is this bug located in?
    validations:
      required: true

  - type: input
    id: factname
    attributes:
      label: Fact/Assert Name
      description: Which fact is this bug located in? / Which assert is now at fault?  (Be as specific as possible and include line number/frame number/function name/moment/sequence event, etc.)
    validations:
      required: true

  - type: dropdown
    id: repro-rate
    attributes:
      label: How reliably does this issue happen?
      options:
        - Always
        - Most Times
        - Rarely
    validations:
      required: true
      

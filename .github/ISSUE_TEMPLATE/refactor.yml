name: Refactor/Optimisation/Clean-Up
description: Propose a refactor or optimisation to an existing area of testing (if the addition is substantial enough to warrant a new script being created, use the new test template instead)
labels: refactor
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Write a concise yet detailed description of the change and what it must/should/should not contain. Include any relevant links/screenshots at suitable locations in the body of your text.
    validations:
      required: true

  - type: input
    id: scriptname
    attributes:
      label: Script Name
      description: Which script is this change located in?
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: Steps To The Task
      description: Add detailed, ordered steps for someone else to plan and execute this task (add as many steps as you require)
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

name: CI

on:
  pull_request:      

jobs:
 
  CI:
    name: "CI"
    runs-on: Windows
    timeout-minutes: 60
    steps:
      - name: Check out the GM-TestFramework repo
        uses: actions/checkout@v4
        with:
          path: GM-TF
      - name: Testing on PR
        run: |
            $maxIdleTime = 120  # Max idle time in seconds (e.g., 60 seconds)
            $lastActivityTime = Get-Date

            $logFile = "activity_log.txt"

            function Log-Message {
                param (
                  [string]$message
                )
            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $logEntry = "$timestamp - $message"
            Write-Output "##[debug]$logEntry" 
            }

            function Check-Activity {
                $currentTime = Get-Date
                $elapsedTime = ($currentTime - $lastActivityTime).TotalSeconds
                Log-Message "Checking activity... Elapsed time: $elapsedTime seconds."
                if ($elapsedTime -ge $maxIdleTime) {
                    Log-Message "No activity for $elapsedTime seconds, exiting script..."
                    Stop-Process -Id $launcherProcess.Id  # Stop the launcher process if idle
                    exit 1  # Exit the script if idle
                }
            }

            function Track-Activity {
              $global:lastActivityTime = Get-Date  
              Write-Host "Activity detected, timer reset to $global:lastActivityTime"
            }

            Register-EngineEvent -SourceIdentifier "TestActivity" -Action { Track-Activity }

            Log-Message "Starting the command..."
            $arguments = @(
                "igorRunTests",
                "--config-file", "C:\GM-TestFramework\configs\${{ github.event.inputs.CONFIG_FILE }}",
                "--feed", "${{ secrets.RSS_FEED_RED }}",
                "${{ github.event.inputs.EXTRA_PARAMS }}",
                "--runtime-version", "${{ github.event.inputs.RUNTIME_VERSION }}"
            )
            $launcherProcess = Start-Process -FilePath ".\launcher" -ArgumentList $arguments -PassThru

            function Monitor-Process {
              while ($launcherProcess.HasExited -eq $false) {
                Check-Activity
                Start-Sleep -Seconds 60
              }
            Log-Message "Launcher process has exited."
            }

            Monitor-Process
        working-directory: GM-TF
        shell: pwsh
      - name: Upload Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary_file
          path: ${{ github.workspace }}\GM-TF\results         
      - name: Running TF Compare Script
        run: python .\tf_compare.py --github-token ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }} --workflow  ${{ github.workflow }}.yml
        working-directory: GM-TF
      - name: Upload TF Compare Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: tf_compare_output_file
            path: ${{ github.workspace }}\GM-TF\TF_Output.txt        
            
  Slack-Notification:
    name: "Slack Notification"
    runs-on: ubuntu-latest
    needs: [CI]
    steps:
      - name: Slack Notification on Failure
        if: (failure() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'stopped'))
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: gm-test-automation
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'good' or '#ff00ff'
          SLACK_ICON: https://github.com/pink.png?size=48
          SLACK_MESSAGE: '${{ github.workflow }}-Build Failed'
          SLACK_TITLE: GM-Tesframework Build Failed
          SLACK_USERNAME: suchitra
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}   
        
      

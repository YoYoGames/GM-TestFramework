name: Beta

on:

  workflow_dispatch:
    inputs:
       CONFIG_FILE:
         description: "CONFIG_FILE"
         required: true
       RSS_Feed:
         description: "RSS_Feed"
         required: false
         type: string
       EXTRA_PARAMS:
          description: "EXTRA_PARAMS from config"
          required: false
          type: string   
       RUNTIME_VERSION:
          description: "Full Runtime Version"
          required: true
          type: string                  

jobs:
 
  Beta:
    name: "Beta"
    runs-on: Windows
    timeout-minutes: 60
    steps:
      - name: Check out the GM-TestFramework repo
        uses: actions/checkout@v4
        with:
          path: GM-TF
      - name: Wait for 10 Minutes
        run: Start-Sleep -Seconds 300
        shell: pwsh         
      - name: Testing Manually with passing RSS_Feed for Beta builds
        run: ./launcher igorRunTests --config-file "C:\GM-TestFramework\configs\${{ github.event.inputs.CONFIG_FILE }}" --feed '${{ secrets.RSS_FEED_BETA }}' ${{ github.event.inputs.EXTRA_PARAMS }}
        working-directory: GM-TF  
        shell: pwsh        
      - name: Upload Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary_file-${{ github.event.inputs.RUNTIME_VERSION }}
          path: ${{ github.workspace }}\GM-TF\results           
      - name: Running TF Compare Script
        run: python .\tf_compare.py --github-token ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }} --workflow  ${{ github.workflow }}.yml --rt ${{ github.event.inputs.RUNTIME_VERSION }}
        working-directory: GM-TF
      - name: Upload TF Compare Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: tf_compare_output_file
            path: ${{ github.workspace }}\GM-TF\TF_Output.txt    
    
            
  Slack_Notification:
    name: "Slack_Notification"
    runs-on: ubuntu-24.04
    needs: Beta
    if: always()
    steps:            
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: gmtestframework-pipeline
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_ICON: https://github.com/black.png?size=48
          SLACK_MESSAGE: "${{ github.run_number}} Testframework Build with Runtime version ${{ github.event.inputs.RUNTIME_VERSION }} is *${{ job.status }}*" 
          SLACK_TITLE: GM-Tesframework Beta Build
          SLACK_USERNAME: ${{ github.actor }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}             
        
      

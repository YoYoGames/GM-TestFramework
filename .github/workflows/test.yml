name: Test

on:

  workflow_dispatch:
    inputs:
       CONFIG_FILE:
         description: "CONFIG_FILE"
         required: true
       RSS_Feed:
         description: "RSS_Feed"
         required: false
         type: string
       EXTRA_PARAMS:
          description: "EXTRA_PARAMS from config"
          required: false
          type: string  
       RUNTIME_VERSION:
          description: "Full Runtime Version"
          required: true
          type: string       

jobs:
 
  Red:
    name: "Red"
    runs-on: Windows
    timeout-minutes: 60
    steps:
      - name: Read test stats
        id: read-stats
        run: |
          STATS=$(cat C:\GM-TestFramework\slack_stats.json | jq -c .)
          echo "STATS=$STATS" >> $GITHUB_ENV

#   Slack_Notification:
#     name: "Slack_Notification"
#     needs: Red
#     runs-on: ubuntu-24.04
#     if: always()
    # steps:
      - name: Send Test Stats to Slack
        uses: slackapi/slack-github-action@v2.0.0
        with:
          payload: |
            {
              "channel": "gmtestframework-pipeline",
              "username": "${{ github.actor }}",
              "icon_url": "https://github.com/black.png?size=48",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "title": "GM-TestFramework Monthly Build",
                  "text": "${{ github.run_number }} Testframework Build with Runtime version ${{ github.event.inputs.RUNTIME_VERSION }} is *${{ job.status }}*\n\n:bar_chart: *Test Run Statistics* :bar_chart:\n```${{ env.STATS }}```"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 
        
      
